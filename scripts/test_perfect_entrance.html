<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Perfect Alive Entrance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #040507;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #040507;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 1. Deep Space Carbon & Amber Studio Spotlight */
    .ambient-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 25%, rgba(249, 115, 22, 0.16) 0%, rgba(10, 12, 18, 0.8) 55%, #040507 90%);
      pointer-events-none;
    }

    /* 2. Realistic Wet Asphalt Road & Perspective Grid */
    .road-plane {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48%;
      overflow: hidden;
      pointer-events-none;
    }

    .road-asphalt-texture {
      position: absolute;
      inset: 0;
      background-image: url('../public/images/entrance/dark_road_smoke.jpg');
      background-size: cover;
      background-position: center bottom;
      opacity: 0.55;
      mix-blend-mode: screen;
      filter: contrast(1.15) brightness(0.9);
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 40%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 40%, transparent 100%);
    }

    .road-grid {
      position: absolute;
      width: 200%;
      left: -50%;
      height: 100%;
      transform: perspective(380px) rotateX(65deg) translate3d(0, -20px, 0);
      transform-origin: center bottom;
      background-image:
        linear-gradient(to right, rgba(249, 115, 22, 0.22) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(249, 115, 22, 0.16) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.85) 20%, transparent 85%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.85) 20%, transparent 85%);
      animation: roadGridScroll 1.1s linear infinite;
    }

    @keyframes roadGridScroll {
      from { background-position-y: 0px; }
      to { background-position-y: 56px; }
    }

    /* Center High-Energy Runway Laser Line */
    .runway-laser {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 45%;
      background: linear-gradient(to top, #f97316 0%, #fed7aa 40%, transparent 100%);
      box-shadow: 0 0 16px 4px rgba(249, 115, 22, 0.8), 0 0 35px 8px rgba(249, 115, 22, 0.4);
      pointer-events-none;
    }

    /* 3. Rolling Procedural Smoke & Tire Mist */
    @keyframes smokeDriftA {
      0% { transform: translateX(60px) translateY(0) scale(1); opacity: 0.35; }
      50% { transform: translateX(-40px) translateY(-10px) scale(1.15); opacity: 0.65; }
      100% { transform: translateX(-120px) translateY(5px) scale(1.28); opacity: 0.25; }
    }
    @keyframes smokeDriftB {
      0% { transform: translateX(90px) scale(0.92); opacity: 0.3; }
      50% { transform: translateX(-30px) scale(1.22); opacity: 0.6; }
      100% { transform: translateX(-110px) scale(1.32); opacity: 0.2; }
    }

    .smoke-layer {
      position: absolute;
      bottom: 18%;
      width: 140%;
      height: 240px;
      pointer-events-none;
      filter: blur(34px);
    }
    .smoke-1 {
      background: radial-gradient(ellipse at 40% 70%, rgba(249, 115, 22, 0.22), rgba(56, 189, 248, 0.08) 50%, transparent 75%);
      animation: smokeDriftA 8s ease-in-out infinite alternate;
    }
    .smoke-2 {
      background: radial-gradient(ellipse at 65% 75%, rgba(255, 255, 255, 0.25), rgba(14, 165, 233, 0.14) 45%, transparent 70%);
      animation: smokeDriftB 10s ease-in-out infinite alternate;
    }

    /* 4. Car Stage */
    .car-stage {
      position: relative;
      width: 100%;
      max-width: 1050px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Keyframe Animations */
    @keyframes wheelRoll {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .wheel-spinning {
      animation: wheelRoll 0.5s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes beamPulse {
      0%, 100% { opacity: 0.88; transform: scaleY(0.98); }
      50% { opacity: 1; transform: scaleY(1.02); filter: drop-shadow(0 0 14px #38BDF8); }
    }
    .beam-active {
      animation: beamPulse 1.8s ease-in-out infinite;
      transform-origin: 220px 245px;
    }

    @keyframes neonPulse {
      0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 4px #F97316); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #F97316); }
    }
    .neon-glow {
      animation: neonPulse 1.6s ease-in-out infinite;
    }

    /* HUD Bar */
    .telemetry-hud {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(14, 17, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 8px 24px;
      border-radius: 9999px;
      backdrop-filter: blur(14px);
      font-family: monospace;
      font-size: 11px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 20px rgba(249, 115, 22, 0.2);
    }
    .hud-label { color: #94a3b8; font-weight: bold; }
    .hud-val { color: #f8fafc; font-weight: bold; }
    .hud-orange { color: #f97316; font-weight: 900; }
    .hud-green { color: #10b981; font-weight: bold; }

    /* Brand Typography */
    .brand-title {
      margin-top: 16px;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      background: linear-gradient(to right, #ffffff 15%, #fed7aa 60%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      filter: drop-shadow(0 2px 14px rgba(249, 115, 22, 0.35));
    }
    .brand-sub {
      font-size: 11px;
      font-family: monospace;
      letter-spacing: 0.45em;
      color: #94a3b8;
      text-transform: uppercase;
      text-align: center;
      margin-top: 5px;
    }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    .skip-btn {
      padding: 6px 18px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    .skip-btn:hover {
      background: rgba(249, 115, 22, 0.25);
      border-color: #f97316;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="ambient-glow"></div>

    <!-- Realistic Road & Perspective Grid -->
    <div class="road-plane">
      <div class="road-asphalt-texture"></div>

    <!-- Rolling Atmospheric Smoke -->

    <!-- Top Watermark & Skip -->

        PIT STOP CAR HIRE • MGARR ATELIER • MALTA

    <!-- Main Dynamic Vector Machine -->
    <div class="car-stage">

          <!-- Amber Wet Asphalt Underglow Reflection -->

            <stop offset="0%" stopColor="#F97316" stopOpacity="0.4" />

        </defs>

            C 560,132 630,135 680,148

            C 920,296 910,310 895,322
