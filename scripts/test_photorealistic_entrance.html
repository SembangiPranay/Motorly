<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photorealistic Cinematic Automotive Entrance Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
    }

    /* Ambient Spotlight Halo */
    .ambient-halo {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1000px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(249, 115, 22, 0.15) 0%, rgba(13, 16, 23, 0.6) 45%, transparent 75%);
      pointer-events-none;
      transition: opacity 1.5s ease;
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
    }
    .brand-watermark {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: monospace;
      font-size: 11px;
      color: #94A3B8;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .skip-btn {
      padding: 6px 20px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #E2E8F0;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s;
    }
    .skip-btn:hover {
      background: rgba(249, 115, 22, 0.25);
      border-color: #F97316;
      color: #fff;
    }

    /* Photorealistic Vehicle Stage Container */
    .car-stage {
      position: relative;
      width: 100%;
      max-width: 1080px;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    /* Teaser Silhouette Image */
    .car-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Overhead PS Hexagon Monogram */
    .ps-crest {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      transition: all 0.8s ease;
    }

    /* Volumetric Laser Headlight Beam Throw */
    .laser-beam {
      position: absolute;
      top: 48%;
      left: 0%;
      width: 28%;
      height: 35%;
      background: linear-gradient(105deg, transparent 0%, rgba(56, 189, 248, 0.35) 60%, rgba(255, 255, 255, 0.85) 100%);
      clip-path: polygon(100% 12%, 0% 0%, 0% 100%, 100% 65%);
      filter: blur(6px);
      pointer-events-none;
      transition: opacity 0.8s ease;
    }

    /* Clean End-Screen Typography */
    .bottom-hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 40;
      margin-bottom: 8px;
    }

    .clean-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 20, 28, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 6px 22px;
      border-radius: 9999px;
      backdrop-filter: blur(14px);
      font-family: monospace;
      font-size: 11px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      background: linear-gradient(to right, #FFFFFF 15%, #FED7AA 60%, #F97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      filter: drop-shadow(0 2px 16px rgba(249, 115, 22, 0.45));
    }

    .brand-sub {
      font-size: 11px;
      font-family: monospace;
      letter-spacing: 0.42em;
      color: #94A3B8;
      text-transform: uppercase;
      text-align: center;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Progress Line */
    .progress-track {
      width: 240px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      margin-top: 14px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 75%;
      background: linear-gradient(to right, #EA580C, #F97316, #FFFFFF);
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="ambient-halo"></div>

    <!-- Top Watermark & Skip -->
    <div class="top-bar">
      <div class="brand-watermark">
        <span style="width:8px; height:8px; border-radius:50%; background:#F97316; display:inline-block; box-shadow:0 0 10px #F97316;"></span>
        PIT STOP CAR HIRE • PRESTIGE & EXECUTIVE FLEET
      </div>
      <button class="skip-btn">Skip Intro &rarr;</button>
    </div>

    <!-- Center 8K Photorealistic Vehicle Stage -->
    <div class="car-stage">
      <!-- 1. Photorealistic Teaser Silhouette Layer (Specular Light Tracing) -->
      <img
        id="teaserLayer"
        src="../public/images/entrance/gt_silhouette_teaser.jpg"
        class="car-layer"
        style="opacity: 0;"
      />

      <!-- 2. Photorealistic Full Reveal Layer (Liquid Platinum Metallic Paint) -->
      <img
        id="revealLayer"
        src="../public/images/entrance/gt_full_reveal.jpg"
        class="car-layer"
        style="opacity: 1;"
      />

      <!-- Overhead PS Hexagon Monogram Badge -->
      <div class="ps-crest">
        <svg width="48" height="54" viewBox="-24 -28 48 56">
          <polygon
            points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13"
            fill="none"
            stroke="#F97316"
            stroke-width="5"
            stroke-opacity="0.3"
          />
          <polygon
            points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13"
            fill="rgba(10, 13, 20, 0.95)"
            stroke="#F97316"
            stroke-width="2"
          />
          <text
            x="0"
            y="5"
            text-anchor="middle"
            fill="#FFFFFF"
            font-size="14"
            font-weight="900"
            font-family="sans-serif"
            letter-spacing="1"
          >
            PS
          </text>
        </svg>
      </div>
    </div>

    <!-- Clean, High-End Storyboard End-Screen Reveal -->
    <div class="bottom-hero">
      <!-- Minimalist Cockpit Status Pill -->
      <div class="clean-pill">
        <span style="width:7px; height:7px; border-radius:50%; background:#10B981; display:inline-block; box-shadow:0 0 8px #10B981;"></span>
        <span style="color:#38BDF8; font-weight:700;">AIR LEVEL 0 (GT LOW)</span>
        <span style="color:#64748B;">•</span>
        <span style="color:#F97316; font-weight:700;">GT CRUISE</span>
        <span style="color:#64748B;">•</span>
        <span style="color:#F1F5F9; font-weight:700;">640 KM RANGE</span>
        <span style="color:#64748B;">•</span>
        <span style="color:#10B981; font-weight:700; letter-spacing:0.1em;">FLEET READY</span>
      </div>

      <!-- Hero Title -->
      <h1 class="brand-title">PIT STOP</h1>

      <!-- Clean Subtitle -->
      <p class="brand-sub">PRESTIGE & EXECUTIVE FLEET • 36 TRIQ IL-KBIRA, MGARR, MALTA</p>

      <!-- Bottom Progress Track -->
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>
</body>
</html>
