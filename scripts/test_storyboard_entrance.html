<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Storyboard Entrance Animation Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #040507;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #040507;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px;
    }

    /* Ambient Spotlight */
    .ambient-spotlight {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 380px;
      background: radial-gradient(ellipse, rgba(249, 115, 22, 0.18) 0%, rgba(13, 16, 23, 0.8) 55%, transparent 75%);
      pointer-events-none;
      transition: opacity 1.2s ease;
    }

    /* Wet Road Runway Floor */
    .floor-runway {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 46%;
      overflow: hidden;
      pointer-events-none;
    }
    .floor-grid {
      position: absolute;
      width: 200%;
      left: -50%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(249, 115, 22, 0.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(249, 115, 22, 0.12) 1px, transparent 1px);
      background-size: 54px 54px;
      transform: perspective(440px) rotateX(68deg) translateY(-10px);
      transform-origin: center bottom;
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 20%, rgba(0,0,0,0.4) 65%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 20%, rgba(0,0,0,0.4) 65%, transparent 100%);
    }
    .road-center-stripe {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 45%;
      background: linear-gradient(to top, rgba(249, 115, 22, 0.7) 0%, rgba(255, 255, 255, 0.4) 35%, transparent 100%);
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.8);
    }

    /* Soft Rolling Ground Smoke */
    .ground-smoke {
      position: absolute;
      bottom: 15%;
      left: -10%;
      width: 120%;
      height: 180px;
      filter: blur(34px);
      pointer-events-none;
      background: radial-gradient(ellipse at 42% 65%, rgba(249, 115, 22, 0.2), rgba(56, 189, 248, 0.08) 45%, transparent 70%),
                  radial-gradient(ellipse at 68% 70%, rgba(203, 213, 225, 0.22), rgba(14, 165, 233, 0.1) 42%, transparent 68%);
      transition: opacity 1s ease;
    }

    /* Specular Light Sweep Animation */
    @keyframes laserSweep {
      0% { stroke-dashoffset: 1400; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.8; }
    }
    .specular-laser-line {
      stroke-dasharray: 700 700;
      animation: laserSweep 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes wheelRoll {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .wheel-spinning {
      animation: wheelRoll 0.6s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    /* Brand Reveal Typography */
    .brand-title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      background: linear-gradient(to right, #FFFFFF 20%, #FED7AA 60%, #F97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      filter: drop-shadow(0 2px 14px rgba(249, 115, 22, 0.4));
    }
    .brand-sub {
      font-size: 11px;
      font-family: monospace;
      letter-spacing: 0.45em;
      color: #94A3B8;
      text-transform: uppercase;
      text-align: center;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Minimal Clean Telemetry Pill */
    .clean-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 20, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 20px;
      border-radius: 9999px;
      backdrop-filter: blur(12px);
      font-family: monospace;
      font-size: 11px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <!-- Ambient Studio Spotlight -->
    <div class="ambient-spotlight"></div>

    <!-- Runway Floor & Ground Smoke -->
    <div class="floor-runway">
      <div class="floor-grid"></div>
      <div class="road-center-stripe"></div>
    </div>
    <div class="ground-smoke"></div>

    <!-- Top Watermark & Skip -->
    <div style="position:relative; width:100%; max-width:1100px; display:flex; justify-content:space-between; align-items:center; z-index:30;">
      <div style="display:flex; align-items:center; gap:8px; font-family:monospace; font-size:10.5px; color:#94A3B8; letter-spacing:0.2em;">
        <span style="width:8px; height:8px; border-radius:50%; background:#F97316; display:inline-block; box-shadow:0 0 10px #F97316;"></span>
        PIT STOP CAR HIRE • MALTA FLEET DISPATCH
      </div>
      <button style="padding:6px 18px; border-radius:9999px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18); color:#E2E8F0; font-size:11px; font-weight:600; cursor:pointer; backdrop-filter:blur(8px);">
        Skip Intro &rarr;
      </button>
    </div>

    <!-- Center Hero Car Stage -->
    <div style="position:relative; width:100%; max-width:980px; display:flex; flex-direction:column; align-items:center; z-index:20;">
      <svg viewBox="0 0 1000 400" style="width:100%; height:auto; overflow:visible;">
        <defs>
          <!-- 1. Metallic Liquid GT Silver Paint Gradient -->
          <linearGradient id="gtSilverPaint" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor="#FFFFFF" />
            <stop offset="20%" stopColor="#F1F5F9" />
            <stop offset="45%" stopColor="#CBD5E1" />
            <stop offset="70%" stopColor="#94A3B8" />
            <stop offset="90%" stopColor="#64748B" />
            <stop offset="100%" stopColor="#334155" />
          </linearGradient>

          <!-- 2. Razor Specular Horizon Highlight -->
          <linearGradient id="specularLaserGlow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0" />
            <stop offset="20%" stopColor="#FFFFFF" stopOpacity="1" />
            <stop offset="60%" stopColor="#FED7AA" stopOpacity="1" />
            <stop offset="90%" stopColor="#F97316" stopOpacity="0.9" />
            <stop offset="100%" stopColor="#EA580C" stopOpacity="0" />
          </linearGradient>

          <!-- 3. Ceramic Privacy Glass -->
          <linearGradient id="gtGlassTint" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stopColor="#0F172A" stopOpacity="0.96" />
            <stop offset="60%" stopColor="#020617" stopOpacity="0.98" />
            <stop offset="100%" stopColor="#000000" />
          </linearGradient>
          <linearGradient id="glassReflectionGlare" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.6" />
            <stop offset="35%" stopColor="#38BDF8" stopOpacity="0.3" />
            <stop offset="70%" stopColor="#FFFFFF" stopOpacity="0" />
          </linearGradient>

          <!-- 4. Volumetric Headlight Main Beam -->
          <linearGradient id="volumetricBeam" x1="100%" y1="15%" x2="0%" y2="85%">
            <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.98" />
            <stop offset="12%" stopColor="#E0F2FE" stopOpacity="0.9" />
            <stop offset="35%" stopColor="#38BDF8" stopOpacity="0.5" />
            <stop offset="70%" stopColor="#0284C7" stopOpacity="0.18" />
            <stop offset="100%" stopColor="#0369A1" stopOpacity="0" />
          </linearGradient>

          <!-- 5. Carbon Fiber Ground Blades -->
          <linearGradient id="gtCarbonFiber" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#27272A" />
            <stop offset="50%" stopColor="#18181B" />
            <stop offset="100%" stopColor="#09090B" />
          </linearGradient>

          <!-- Master BMW Aero Spoke Unit (True Counter-Clockwise Turbine Sweep) -->
          <g id="bmwAeroSpokeUnit">
            <!-- Dark Anthracite Recessed Aero Inset Flap -->
            <path
              d="
                M -6,-33.5 
                C -1,-33.8 6,-32 11,-27 
                C 8,-21 4,-15 0,-8 
                L -3,-8 
                C 1,-15 4,-21 7,-26 
                C 3,-29 -2,-31.5 -7,-32.5 
                Z"
              fill="#252C37"
              stroke="#13171F"
              stroke-width="0.3"
            />
            <!-- Solid White Diamond-Cut Aero Winglet Spoke with Cutout Window -->
            <path
              fill-rule="evenodd"
              d="
                M -4,-8 
                C -7,-14 -12,-22 -18,-31.5 
                C -15,-33.2 -10,-34 -5,-33.8 
                C -2,-26 1,-17 3,-8 
                Z

                M -6,-11 
                C -8,-16 -12,-22 -15,-28.5 
                C -12,-29.8 -9,-30 -6,-29.5 
                C -4,-23 -2,-17 -1,-10 
                Z"
              fill="#FFFFFF"
              stroke="#CBD5E1"
              stroke-width="0.4"
              filter="drop-shadow(0 1px 2px rgba(0,0,0,0.7))"
            />
            <!-- Secondary Trailing White Hook Blade -->
            <path
              d="
                M -5,-33.8 
                C -1,-34 4,-32.5 8,-29 
                L 6.5,-26.5 
                C 3.5,-29.5 -0.5,-30.8 -4,-30.8 
                Z"
              fill="#FFFFFF"
              stroke="#CBD5E1"
              stroke-width="0.4"
            />
            <!-- Recessed Window Cavity Shadow -->
            <path
              d="
                M -6,-11 
                C -8,-16 -12,-22 -15,-28.5 
                C -12,-29.8 -9,-30 -6,-29.5 
                C -4,-23 -2,-17 -1,-10 
                Z"
              fill="#0A0D14"
              opacity="0.9"
            />
          </g>

          <!-- Complete BMW Wheel Assembly Template -->
          <g id="completeBmwWheel">
            <!-- Outer Michelin Tire Rubber -->
            <circle cx="0" cy="0" r="47" fill="#15181F" stroke="#05070A" stroke-width="2.5" />
            <circle cx="0" cy="0" r="44.5" fill="none" stroke="#0F1218" stroke-width="4.5" stroke-dasharray="6, 3" />
            <circle cx="0" cy="0" r="40" fill="none" stroke="#64748B" stroke-width="0.8" opacity="0.4" />

            <!-- Deep Rim Interior Barrel & Rotor -->
            <circle cx="0" cy="0" r="35" fill="#181D26" stroke="#FFFFFF" stroke-width="1.6" />
            <circle cx="0" cy="0" r="33.5" fill="#3B4452" stroke="#64748B" stroke-width="0.8" />
            <!-- Rotor Cross-Drill Holes -->
            <g fill="#141824" opacity="0.9">
              <circle cx="0" cy="-21" r="1.1" /><circle cx="15" cy="-15" r="1.1" /><circle cx="21" cy="0" r="1.1" />
              <circle cx="15" cy="15" r="1.1" /><circle cx="0" cy="21" r="1.1" /><circle cx="-15" cy="15" r="1.1" />
              <circle cx="-21" cy="0" r="1.1" /><circle cx="-15" cy="-15" r="1.1" />
              <circle cx="0" cy="-26" r="0.9" /><circle cx="18" cy="-18" r="0.9" /><circle cx="26" cy="0" r="0.9" />
              <circle cx="18" cy="18" r="0.9" /><circle cx="0" cy="26" r="0.9" /><circle cx="-18" cy="18" r="0.9" />
              <circle cx="-26" cy="0" r="0.9" /><circle cx="-18" cy="-18" r="0.9" />
            </g>

            <!-- Brembo Caliper in Pit Stop Orange -->
            <g transform="translate(-27, -22)">
              <path
                d="M 2,4 C 7,-1 17,-2 25,2 L 27,14 C 19,17 12,22 5,30 Z"
                fill="#F97316"
                stroke="#FFFFFF"
                stroke-width="1.2"
                filter="drop-shadow(0 3px 5px rgba(0,0,0,0.8))"
              />
              <circle cx="14" cy="11" r="3.2" fill="#FFFFFF" />
              <polygon points="14,9 16.5,12.5 11.5,12.5" fill="#F97316" />
            </g>

            <!-- Outer Silver Rim Flange -->
            <circle cx="0" cy="0" r="34.8" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
            <circle cx="0" cy="0" r="33.8" fill="none" stroke="#475569" stroke-width="0.8" />

            <!-- 5-Spoke Aerodynamic Turbine Assembly (72° Intervals) -->
            <g class="wheel-spinning">
              <use href="#bmwAeroSpokeUnit" transform="rotate(0)" />
              <use href="#bmwAeroSpokeUnit" transform="rotate(72)" />
              <use href="#bmwAeroSpokeUnit" transform="rotate(144)" />
              <use href="#bmwAeroSpokeUnit" transform="rotate(216)" />
              <use href="#bmwAeroSpokeUnit" transform="rotate(288)" />
            </g>

            <!-- Central Hub Assembly & Titanium Lug Ring -->
            <circle cx="0" cy="0" r="10.5" fill="#0F141F" stroke="#CBD5E1" stroke-width="1.4" />
            <g fill="#1E293B" stroke="#000000" stroke-width="0.6">
              <circle cx="0" cy="-8.2" r="1.6" />
              <circle cx="7.8" cy="-2.5" r="1.6" />
              <circle cx="4.8" cy="6.6" r="1.6" />
              <circle cx="-4.8" cy="6.6" r="1.6" />
              <circle cx="-7.8" cy="-2.5" r="1.6" />
            </g>
            <!-- Center Emblem Roundel -->
            <circle cx="0" cy="0" r="6" fill="#0B0F17" stroke="#FFFFFF" stroke-width="1.2" />
            <circle cx="0" cy="0" r="4.8" fill="#0F172A" />
            <path d="M 0,-4.8 A 4.8 4.8 0 0 1 4.8,0 L 0,0 Z" fill="#F97316" />
            <path d="M 0,0 L -4.8,0 A 4.8 4.8 0 0 1 0,-4.8 Z" fill="#FFFFFF" />
            <path d="M 0,4.8 A 4.8 4.8 0 0 1 -4.8,0 L 0,0 Z" fill="#F97316" />
            <path d="M 0,0 L 4.8,0 A 4.8 4.8 0 0 1 0,4.8 Z" fill="#FFFFFF" />
            <circle cx="0" cy="0" r="1.8" fill="#0A0D14" stroke="#FFFFFF" stroke-width="0.6" />
          </g>
        </defs>

        <!-- Ground Shadow & Tire Contact -->
        <ellipse cx="490" cy="355" rx="440" ry="18" fill="rgba(0,0,0,0.95)" />
        <ellipse cx="230" cy="352" rx="46" ry="6.5" fill="#000000" />
        <ellipse cx="730" cy="352" rx="48" ry="7" fill="#000000" />

        <!-- Volumetric Headlight Cone & Laser Projection -->
        <g>
          <ellipse cx="60" cy="358" rx="140" ry="18" fill="rgba(56,189,248,0.25)" />
          <polygon points="132,265 -180,300 -220,400 115,345" fill="url(#volumetricBeam)" />
          <polygon points="135,264 -140,285 -160,360 122,315" fill="url(#volumetricBeam)" opacity="0.88" />
          <line x1="132" y1="265" x2="-200" y2="345" stroke="#E0F2FE" stroke-width="2.8" stroke-linecap="round" />
        </g>

        <!-- Inner Wheel Arch Shadows -->
        <path d="M 175,340 C 175,270 200,246 230,246 C 260,246 285,270 285,340 Z" fill="#040608" />
        <path d="M 675,340 C 675,270 702,246 730,246 C 758,246 785,270 785,340 Z" fill="#040608" />

        <!-- Sculpted Liquid Platinum GT Bodywork -->
        <path
          d="
            M 104,337 
            C 98,328 97,314 104,300 
            C 111,286 122,278 135,276 
            C 145,264 165,256 195,250 
            C 215,246 230,245 250,246 
            C 285,248 315,252 345,250 
            C 370,222 410,192 465,180 
            C 525,168 600,170 655,188 
            C 715,208 765,236 805,246 
            C 828,248 840,246 852,242 
            C 858,248 860,258 856,268 
            C 850,286 844,306 836,322 
            C 828,334 818,338 800,339 
            C 792,339 788,339 785,339 
            C 782,294 760,252 730,252 
            C 700,252 680,294 676,339 
            L 284,339 
            C 282,294 260,254 230,254 
            C 200,254 182,294 178,339 
            L 104,337 
            Z"
          fill="url(#gtSilverPaint)"
          stroke="#94A3B8"
          stroke-width="1.5"
        />

        <!-- Front Lower Air Dam & Intake Scoop -->
        <path d="M 106,335 C 112,324 126,318 150,317 L 153,336 Z" fill="#080C14" stroke="#1E293B" stroke-width="0.8" />

        <!-- Tornado Specular Horizon Line -->
        <path
          d="M 138,264 C 205,252 305,244 420,238 C 540,234 670,228 765,226 C 810,226 838,236 852,242"
          fill="none"
          stroke="url(#specularLaserGlow)"
          stroke-width="3.2"
          stroke-linecap="round"
        />

        <!-- Specular Roofline Laser Tracing Ribbon (The "SHINING" Effect from Storyboard) -->
        <path
          class="specular-laser-line"
          d="
            M 104,337 
            C 98,328 97,314 104,300 
            C 111,286 122,278 135,276 
            C 145,264 165,256 195,250 
            C 215,246 230,245 250,246 
            C 285,248 315,252 345,250 
            C 370,222 410,192 465,180 
            C 525,168 600,170 655,188 
            C 715,208 765,236 805,246 
            C 828,248 840,246 852,242"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.5"
          filter="drop-shadow(0 0 8px #FFFFFF) drop-shadow(0 0 16px #38BDF8)"
        />

        <!-- Ceramic Tinted Glasshouse & Specular Windshield Glare -->
        <path
          d="
            M 360,250 
            C 382,222 418,198 470,186 
            C 525,174 592,176 648,190 
            C 700,204 746,232 784,246 
            C 725,247 645,246 560,245 
            C 490,244 425,245 360,250 
            Z"
          fill="url(#gtGlassTint)"
        />
        <polygon points="380,245 445,188 470,188 395,248" fill="url(#glassReflectionGlare)" />
        <line x1="550" y1="176" x2="550" y2="245" stroke="#000000" stroke-width="4" />
        <line x1="550" y1="176" x2="550" y2="245" stroke="#334155" stroke-width="1.5" />

        <!-- Carbon Ground Effect Blades with Neon Orange Slit -->
        <polygon points="282,339 678,339 674,344 286,344" fill="url(#gtCarbonFiber)" />
        <line x1="284" y1="343.5" x2="676" y2="343.5" stroke="#F97316" stroke-width="2" />
        <polygon points="98,339 178,339 175,343 102,343" fill="url(#gtCarbonFiber)" />
        <line x1="100" y1="342.5" x2="176" y2="342.5" stroke="#F97316" stroke-width="1.8" />
        <polygon points="786,339 844,335 848,342 790,343" fill="url(#gtCarbonFiber)" />

        <!-- 5-Segment Matrix LED Cluster -->
        <g transform="translate(132, 256)">
          <polygon points="0,16 16,8 54,0 48,16 10,22" fill="#0B111C" stroke="#38BDF8" stroke-width="1" />
          <polygon points="4,15 14,9 46,2 42,14 12,19" fill="#0284C7" opacity="0.6" />
          <rect x="8" y="12" width="6" height="5" rx="1.5" fill="#FFFFFF" filter="drop-shadow(0 0 6px #38BDF8)" />
          <rect x="17" y="9" width="6" height="5" rx="1.5" fill="#FFFFFF" filter="drop-shadow(0 0 6px #38BDF8)" />
          <rect x="26" y="6" width="6" height="5" rx="1.5" fill="#FFFFFF" filter="drop-shadow(0 0 6px #38BDF8)" />
          <rect x="35" y="3" width="6" height="5" rx="1.5" fill="#FFFFFF" filter="drop-shadow(0 0 6px #38BDF8)" />
          <line x1="2" y1="18" x2="48" y2="15" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
        </g>

        <!-- Ruby OLED Taillight Lightblade -->
        <g transform="translate(805, 240)">
          <path d="M 0,6 C 18,6 36,4 47,2 C 48,5 45,10 40,14 C 28,14 12,12 0,10 Z" fill="#4C0519" stroke="#E11D48" stroke-width="0.8" />
          <path d="M 4,7 C 20,7 35,5 44,3" fill="none" stroke="#FF1E44" stroke-width="2.5" filter="drop-shadow(0 0 10px #FF1E44)" />
          <circle cx="45" cy="3.5" r="14" fill="rgba(255,30,68,0.3)" filter="blur(8px)" />
        </g>

        <!-- Perfectly Aligned BMW Aero Turbine Wheels (Front & Rear) -->
        <g transform="translate(230, 305)">
          <use href="#completeBmwWheel" />
        </g>
        <g transform="translate(730, 305)">
          <use href="#completeBmwWheel" />
        </g>

        <!-- Overhead PS Hexagon Monogram Crest -->
        <g transform="translate(500, 60)">
          <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="#F97316" stroke-width="5" stroke-opacity="0.25" />
          <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="rgba(10, 13, 20, 0.95)" stroke="#F97316" stroke-width="2" />
          <text x="0" y="6" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="900" font-family="sans-serif" letter-spacing="1">PS</text>
        </g>
      </svg>
    </div>

    <!-- Clean, Professional End Screen Reveal (Zero Word Clutter!) -->
    <div style="position:relative; display:flex; flex-direction:column; align-items:center; z-index:30; margin-bottom:12px;">
      <!-- Minimalist Status Pill -->
      <div class="clean-pill">
        <span style="width:7px; height:7px; border-radius:50%; background:#10B981; display:inline-block; box-shadow:0 0 8px #10B981;"></span>
        <span style="color:#F1F5F9; font-weight:700; letter-spacing:0.15em;">FLEET DISPATCH READY</span>
        <span style="color:#64748B;">•</span>
        <span style="color:#F97316; font-weight:700;">640 KM RANGE</span>
      </div>

      <!-- Hero Brand Title & Subtitle -->
      <h1 class="brand-title">PIT STOP</h1>
      <p class="brand-sub">PRESTIGE & EXECUTIVE FLEET • MALTA</p>
    </div>
  </div>
</body>
</html>
