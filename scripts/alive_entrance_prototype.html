<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alive Creative Automotive Entrance Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #040507;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #040507;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 1. Atmospheric Ambient Lighting */
    .ambient-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(249, 115, 22, 0.12) 0%, rgba(10, 12, 18, 0.8) 55%, #040507 85%);
      pointer-events-none;
    }

    /* 2. Dynamic 3D Perspective Road & Grid Floor */
    .road-perspective-plane {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48%;
      perspective: 450px;
      overflow: hidden;
      pointer-events-none;
    }

    .road-grid {
      position: absolute;
      width: 200%;
      left: -50%;
      height: 100%;
      transform: rotateX(68deg) translateY(-20px);
      transform-origin: center bottom;
      background-image: 
        linear-gradient(to right, rgba(249, 115, 22, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(249, 115, 22, 0.12) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, rgba(0,0,0,0.6) 60%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, rgba(0,0,0,0.6) 60%, transparent 100%);
      animation: roadScroll 1.2s linear infinite;
    }

    @keyframes roadScroll {
      from { background-position-y: 0px; }
      to { background-position-y: 50px; }
    }

    /* Road Center Marking Line */
    .road-center-stripe {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 42%;
      background: linear-gradient(to top, rgba(249, 115, 22, 0.6) 0%, rgba(255, 255, 255, 0.4) 40%, transparent 100%);
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.8);
      pointer-events-none;
    }

    /* 3. Rolling Procedural Smoke & Fog */
    @keyframes smokeDriftA {
      0% { transform: translateX(80px) translateY(0) scale(1); opacity: 0.35; }
      50% { transform: translateX(-40px) translateY(-12px) scale(1.18); opacity: 0.65; }
      100% { transform: translateX(-140px) translateY(6px) scale(1.3); opacity: 0.25; }
    }
    @keyframes smokeDriftB {
      0% { transform: translateX(100px) scale(0.9); opacity: 0.3; }
      50% { transform: translateX(-20px) scale(1.25); opacity: 0.6; }
      100% { transform: translateX(-120px) scale(1.35); opacity: 0.2; }
    }

    .smoke-layer {
      position: absolute;
      bottom: 18%;
      width: 150%;
      height: 240px;
      pointer-events-none;
      filter: blur(36px);
    }
    .smoke-1 {
      background: radial-gradient(ellipse at 40% 70%, rgba(249, 115, 22, 0.22), rgba(56, 189, 248, 0.08) 50%, transparent 75%);
      animation: smokeDriftA 8s ease-in-out infinite alternate;
    }
    .smoke-2 {
      background: radial-gradient(ellipse at 65% 75%, rgba(255, 255, 255, 0.28), rgba(14, 165, 233, 0.15) 45%, transparent 70%);
      animation: smokeDriftB 10s ease-in-out infinite alternate;
    }

    /* 4. Car Stage Container */
    .car-stage {
      position: relative;
      width: 100%;
      max-width: 1050px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Keyframe Animations for Car Life & Energy */
    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .wheel-spinning {
      animation: wheelSpin 0.5s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes beamFlow {
      0%, 100% { opacity: 0.9; transform: scaleY(0.98); }
      50% { opacity: 1; transform: scaleY(1.02); filter: drop-shadow(0 0 12px #38BDF8); }
    }
    .beam-alive {
      animation: beamFlow 2s ease-in-out infinite;
      transform-origin: 130px 260px;
    }

    @keyframes neonGlowPulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #F97316); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #F97316); }
    }
    .neon-pulse {
      animation: neonGlowPulse 1.8s ease-in-out infinite;
    }

    /* HUD Bar */
    .telemetry-hud {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(14, 17, 24, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 8px 24px;
      border-radius: 9999px;
      backdrop-filter: blur(14px);
      font-family: monospace;
      font-size: 11px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 20px rgba(249, 115, 22, 0.15);
    }
    .hud-label { color: #94a3b8; font-weight: bold; }
    .hud-val { color: #f8fafc; font-weight: bold; }
    .hud-orange { color: #f97316; font-weight: 900; }
    .hud-green { color: #10b981; font-weight: bold; }

    /* Brand Typography */
    .brand-title {
      margin-top: 16px;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      background: linear-gradient(to right, #ffffff 15%, #fed7aa 60%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      filter: drop-shadow(0 2px 12px rgba(249, 115, 22, 0.3));
    }
    .brand-sub {
      font-size: 11px;
      font-family: monospace;
      letter-spacing: 0.45em;
      color: #94a3b8;
      text-transform: uppercase;
      text-align: center;
      margin-top: 6px;
    }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    .skip-btn {
      padding: 6px 18px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    .skip-btn:hover {
      background: rgba(249, 115, 22, 0.25);
      border-color: #f97316;
      color: #fff;
    }
  </style>
</head>
<body>
